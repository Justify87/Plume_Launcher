name: Feature request
description: Suggest a feature or design improvement for Plume Launcher Advanced
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This is the independent Plume Launcher Advanced fork. Cohesive multi-screen
        redesigns, modern UI components, and justified libraries are in scope.
        See [current design rules](https://github.com/Justify87/Plume_Launcher/blob/main/docs/v-design/DESIGN_CONTRACT.md)
        and [contribution guidance](https://github.com/Justify87/Plume_Launcher/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposal
      description: UI mockups, photos, screenshots and broader refactoring ideas are welcome.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Device, navigation and implementation impact
      description: Which screens, D-Pad flows or libraries are involved (if known)?
  - type: checkboxes
    id: review
    attributes:
      label: Privacy and regression considerations
      options:
        - label: I understand VPN functionality and privacy/security gates must remain intact.
          required: true
