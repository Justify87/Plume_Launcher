# Fast pull-request validation; the full combined Mullvad APK is built only when
# integration inputs change (and remains manually buildable from debug-apk.yml).
name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    outputs:
      integrated: ${{ steps.scope.outputs.integrated }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Identify changed components
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/pr-changed-files.txt"
          git diff --name-only "$BASE"...HEAD > "$changed"
          if grep -Eq '^(tools/mullvad/|third_party/mullvadvpn-app(/|$)|\.gitmodules$|\.github/workflows/debug-apk\.yml$|app/src/main/AndroidManifest\.xml$|app/build\.gradle\.kts$|build\.gradle\.kts$|settings\.gradle\.kts$|gradle/libs\.versions\.toml$)' "$changed"; then
            echo 'integrated=true' >> "$GITHUB_OUTPUT"
            echo 'Combined Mullvad APK check: integration inputs changed.'
          else
            echo 'integrated=false' >> "$GITHUB_OUTPUT"
            echo 'Combined Mullvad APK check: not needed for this PR.'
          fi
          if grep -Eq '^(tools/plume-install\.sh$|tools/plume-install-test/)' "$changed"; then
            echo 'installer=true' >> "$GITHUB_OUTPUT"
          else
            echo 'installer=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^tools/(spotify_podcast_probe|test_spotify_podcast_probe)\.py$' "$changed"; then
            echo 'spotify=true' >> "$GITHUB_OUTPUT"
          else
            echo 'spotify=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Review dependency, permission and changelog changes
        run: sh tools/pr-rules.sh "$BASE"

      - name: ADB launcher installer regression tests (when touched)
        if: ${{ steps.scope.outputs.installer == 'true' }}
        run: sh tools/plume-install-test/run.sh

      - name: Spotify podcast feasibility tests (when touched)
        if: ${{ steps.scope.outputs.spotify == 'true' }}
        run: python3 -m unittest discover -s tools -p 'test_spotify_podcast_probe.py' -v

      # The combined APK workflow runs these exact Python tests itself.
      # Run them here only when there is no integrated build to avoid duplication.
      - name: Mullvad staging and APK validator regression tests (offline)
        if: ${{ steps.scope.outputs.integrated != 'true' }}
        run: |
          python3 -m unittest discover -s tools -p 'test_mullvad_prepare.py' -v
          python3 -m unittest discover -s tools -p 'test_mullvad_apk.py' -v

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Unit tests and lint, plus one fast compilation of the legacy launcher
      # module. The actual installable Plume+Mullvad APK is built separately.
      - name: Plume unit tests, lint and Debug compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  mullvad-apk:
    # Path-based instead of branch-name-based; use the unchanged pinned
    # combined APK workflow and keep its manual workflow_dispatch entry.
    needs: check
    if: ${{ needs.check.outputs.integrated == 'true' }}
    uses: ./.github/workflows/debug-apk.yml
    with:
      variant: integrated
