# One visible required PR check; the called workflow itself contains the
# Plume tests, lint, pinned Mullvad container build and APK validation.
name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mullvad-apk:
    uses: ./.github/workflows/debug-apk.yml
