# Build an installable debug APK on demand. No release keystore or secrets required.
name: Build Plume Launcher Advanced Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug:
    name: Build and upload Advanced Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test, lint and build Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK and write checksum
        shell: bash
        run: |
          set -euo pipefail
          apk_dir=app/build/outputs/apk/debug
          mv "$apk_dir/app-debug.apk" "$apk_dir/Plume-Launcher-Advanced-debug.apk"
          test -s "$apk_dir/Plume-Launcher-Advanced-debug.apk"
          (cd "$apk_dir" && sha256sum Plume-Launcher-Advanced-debug.apk > SHA256SUMS)
          {
            echo "### Debug APK ready"
            echo ""
            echo "- Build: \`$GITHUB_RUN_NUMBER\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- APK: \`Plume-Launcher-Advanced-debug.apk\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$apk_dir/SHA256SUMS")\`"
            echo "- Download: **Artifacts** section of this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK and checksum
        uses: actions/upload-artifact@v5
        with:
          name: Plume-Launcher-Advanced-Debug-APK-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/Plume-Launcher-Advanced-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
