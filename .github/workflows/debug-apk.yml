# On-demand test APK only. No release build, publishing, tags, production
# signing keys, version changes or GitHub Releases API.
# The separate ci-integrated.yml remains the full automatic PR gate.
name: Build Plume Launcher Advanced Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build Plume + Mullvad ARM64 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out selected Plume revision and pinned Mullvad submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify pinned Mullvad source and container
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C third_party/mullvadvpn-app rev-parse HEAD)" = 'aa47f606b1a159214c7279344128119fa91be5fd'
          test -z "$(git -C third_party/mullvadvpn-app status --porcelain --ignore-submodules=all)"
          image=$(tr -d '\r\n' < third_party/mullvadvpn-app/building/android-container-image.txt)
          test "$image" = 'ghcr.io/mullvad/mullvadvpn-app-build-android@sha256:ca22c11fb8a15321f897fa169c9c9d1f7d0d9edfeea16fa04af4de71ebcf4286'
          echo "Mullvad source and Android toolchain pinned."

      - name: Run fast integration source and APK validator tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p test_mullvad_prepare.py -v
          python3 -m unittest discover -s tools -p test_mullvad_apk.py -v

      - name: Set up Java for APK signature verification
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch original Mullvad Android build container
        shell: bash
        run: docker pull "$(tr -d '\r\n' < third_party/mullvadvpn-app/building/android-container-image.txt)"

      - name: Build combined ARM64 Debug APK only
        shell: bash
        run: |
          set -euo pipefail
          # Default task in build-integrated.sh is ONLY :app:assembleOssProdDebug.
          # No release, R8 job, GitHub Release, production signing or tag.
          bash tools/mullvad/build-integrated.sh

      - name: Verify installable Debug APK and collect artifact
        shell: bash
        run: |
          set -euo pipefail
          apk_dir=.build/plume-mullvad/mullvadvpn-app/android/app/build/outputs/apk/ossProd/debug
          test -d "$apk_dir"
          mapfile -d '' -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print0)
          if [[ "${#apks[@]}" -ne 1 ]] || [[ ! -s "${apks[0]}" ]]; then
            echo "::error::Expected exactly one non-empty combined ARM64 Debug APK"
            exit 1
          fi
          apk="${apks[0]}"
          python3 tools/mullvad/check_apk.py "$apk"
          mkdir -p artifacts/debug
          image=$(tr -d '\r\n' < third_party/mullvadvpn-app/building/android-container-image.txt)
          in_container="/build/android/app/build/outputs/apk/ossProd/debug/$(basename "$apk")"
          docker run --rm -v "$PWD/.build/plume-mullvad/mullvadvpn-app:/build:ro" "$image" \
            aapt dump badging "$in_container" > artifacts/debug/badging.txt
          docker run --rm -v "$PWD/.build/plume-mullvad/mullvadvpn-app:/build:ro" "$image" \
            aapt dump xmltree "$in_container" AndroidManifest.xml > artifacts/debug/manifest.txt
          expected_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*$/\1/p' app/build.gradle.kts)
          expected_name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*$/\1/p' app/build.gradle.kts)
          test -n "$expected_code" && test -n "$expected_name"
          grep -Fq "package: name='dev.plume.advanced'" artifacts/debug/badging.txt
          grep -Fq "versionCode='$expected_code'" artifacts/debug/badging.txt
          grep -Fq "versionName='$expected_name'" artifacts/debug/badging.txt
          grep -Fxq "native-code: 'arm64-v8a'" artifacts/debug/badging.txt
          for component in \
            'dev.plume.MainActivity' \
            'net.mullvad.mullvadvpn.app.MullvadApplication' \
            'net.mullvad.mullvadvpn.app.service.MullvadVpnService' \
            'net.mullvad.mullvadvpn.app.VpnActivity' \
            'android.intent.category.HOME'; do
            grep -Fq "$component" artifacts/debug/manifest.txt
          done
          if grep -Eq 'PlumeVpnDebugActivity|MainActivityAlt' artifacts/debug/manifest.txt; then
            echo "::error::Unexpected legacy debug harness or phone launcher entry"
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          test -x "$apksigner" || { echo "::error::Android apksigner unavailable"; exit 1; }
          "$apksigner" verify --verbose "$apk" > artifacts/debug/signature-verification.txt
          cp "$apk" artifacts/debug/Plume-Launcher-Advanced-Mullvad-arm64-debug.apk
          (
            cd artifacts/debug
            sha256sum Plume-Launcher-Advanced-Mullvad-arm64-debug.apk > SHA256SUMS
          )
          {
            printf 'Git revision: %s\n' "$GITHUB_SHA"
            printf 'Git ref: %s\n' "$GITHUB_REF"
            printf 'Android package: dev.plume.advanced\n'
            printf 'App version: %s (%s)\n' "$expected_name" "$expected_code"
            printf 'ABI: arm64-v8a\nVariant: ossProdDebug\n'
            printf 'Signing: Android debug key (NOT a production release key)\n'
            printf 'Mullvad source: %s\n' "$(git -C third_party/mullvadvpn-app rev-parse HEAD)"
          } > artifacts/debug/BUILD_INFO.txt
          {
            echo '### On-demand combined Plume + Mullvad Debug APK'
            echo "Source: \`$GITHUB_SHA\` — \`$GITHUB_REF\`"
            echo "Version: \`$expected_name ($expected_code)\`"
            echo 'Package: \`dev.plume.advanced\` · ABI: \`arm64-v8a\`'
            echo "APK bytes: $(stat -c %s "$apk")"
            echo 'Download the installable Debug APK under **Artifacts**.'
            echo 'Debug signing is not compatible with an independently signed production Release APK.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK for sideloading
        uses: actions/upload-artifact@v5
        with:
          name: Plume-Mullvad-ARM64-Debug-${{ github.run_number }}
          path: artifacts/debug/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
